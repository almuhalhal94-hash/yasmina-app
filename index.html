*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 28px);min-height:100dvh;display:flex;flex-direction:column;gap:16px}

.ib{width:52px;height:52px;border-radius:18px;border:0;background:var(--card);box-shadow:var(--sh);font-size:1.4rem;display:grid;place-items:center;flex:none}

.hero h1{margin:0;font-size:1.6rem;line-height:1.25}.hero p{margin:4px 0 0;font-weight:700}

.big.sky{background:linear-gradient(180deg,#7fdcf7,var(--sky));color:#08324a;box-shadow:0 8px 0 #1f93b8,0 14px 24px rgba(76,201,240,.35)}.big.sky:active{box-shadow:0 3px 0 #1f93b8}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.tile i{font-style:normal;font-size:2.4rem;line-height:1}.tile small{font-weight:500;color:var(--muted);font-size:.85rem}
.tile.m{background:var(--mint2)}.tile.s{background:var(--sky2)}.tile.r{background:var(--rose2)}.tile.l{background:var(--lav2)}
.row{display:flex;gap:12px;align-items:center}.grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--bg2);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.95rem}
.steps{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.steps i{width:28px;height:10px;border-radius:9px;background:var(--line)}.steps i.on{background:var(--sun)}.steps i.done{background:var(--mint)}

.ayat{font-family:Quran,serif;font-size:2rem;line-height:2.2;text-align:center;direction:rtl;-webkit-user-select:text;user-select:text}
.ay{display:inline;padding:2px 6px;border-radius:14px;transition:background .3s}.plbar{position:fixed;z-index:45;left:50%;transform:translate(-50%,160%);bottom:calc(env(safe-area-inset-bottom) + 92px);display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:999px;background:var(--card);box-shadow:0 0 0 2px var(--p2),0 10px 26px rgba(160,40,110,.25);font-family:Kid;font-size:.85rem;color:var(--ink);opacity:0;pointer-events:none;transition:transform .3s ease,opacity .3s ease;max-width:calc(100% - 20px)}.plbar.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}.plbar button{flex:none;width:48px;height:48px;border-radius:50%;border:0;font-size:1.4rem;background:var(--sun2);cursor:pointer}.plbar span{text-align:center;line-height:1.3}.ayat .ay{cursor:pointer;border-radius:10px}
.ay.now{background:var(--sun2);color:#3a2300;box-shadow:0 0 0 4px var(--sun2)}
.ay .num{font-family:Kid;font-size:1rem;display:inline-grid;place-items:center;width:1.9em;height:1.9em;border-radius:50%;border:2px solid var(--sun);margin:0 4px;vertical-align:middle;color:var(--ink)}
.ayat.hide .ay{color:transparent;text-shadow:0 0 16px rgba(120,120,140,.6)}.ayat.hide .ay .num{color:var(--ink);text-shadow:none}
.basm{display:block;font-family:Quran,serif;font-size:1.5rem;color:var(--muted);text-align:center}
.counter{display:flex;justify-content:center;gap:10px}.counter i{width:42px;height:42px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-style:normal;font-size:1.3rem;transition:transform .2s}.counter i.on{background:var(--sun);transform:scale(1.1)}
.mark{display:flex;align-items:center;gap:10px;background:var(--bg2);border-radius:20px;padding:10px 12px}.mark .q{flex:1;font-family:Quran,serif;font-size:1.35rem;line-height:1.9}
.mark button{width:56px;height:56px;border-radius:18px;border:0;font-size:1.5rem;box-shadow:var(--sh);background:var(--card)}.mark button.ok.on{background:var(--ok);color:#fff}.mark button.no.on{background:var(--no);color:#fff}
.note{background:var(--sky2);border-radius:20px;padding:12px 14px;font-weight:700}.note.warn{background:var(--rose2)}
.timer{font-size:3.4rem;font-weight:900;text-align:center;font-variant-numeric:tabular-nums}
.move{font-size:5rem;text-align:center;animation:bob 1.2s ease-in-out infinite}

.letter{font-family:En,sans-serif;font-weight:700;font-size:7rem;line-height:1;text-align:center;direction:ltr}
.en{font-family:En,sans-serif;direction:ltr}

.wgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.wgrid.g3{grid-template-columns:repeat(3,1fr)}
.tilesL{display:flex;gap:10px;justify-content:center;direction:ltr;flex-wrap:wrap}

.slot{min-width:74px;height:84px;border-radius:20px;border:3px dashed var(--sky);display:grid;place-items:center;font-family:En,sans-serif;font-weight:700;font-size:2.6rem}

.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mem button{aspect-ratio:1;border:0;border-radius:20px;font-size:2.4rem;background:linear-gradient(135deg,var(--lav),#c3a6ee);color:#fff;box-shadow:var(--sh);font-family:En,sans-serif;font-weight:700}

.stars{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.stars span{aspect-ratio:1;display:grid;place-items:center;font-size:1.8rem;border-radius:16px;background:var(--bg2)}.stars span.on{background:var(--sun2)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.badge{text-align:center;padding:12px 6px;border-radius:20px;background:var(--bg2);font-size:.85rem;font-weight:700}.badge i{display:block;font-style:normal;font-size:2.2rem;filter:grayscale(1);opacity:.35}.badge.on i{filter:none;opacity:1}.badge.on{background:var(--sun2);color:#4a2c00}

@property --ea{syntax:'<angle>';inherits:true;initial-value:0deg}
.edge{position:fixed;inset:0;pointer-events:none;z-index:30;padding:5px;border-radius:0;background:conic-gradient(from var(--ea),#ff8fc7,#ffd1e8,#c9a7ff,#ffd6a8,#ff8fc7);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:edgeSpin 8s linear infinite}.edge.glow{padding:12px;filter:blur(12px);opacity:.55}@keyframes edgeSpin{to{--ea:360deg}}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.door{border:0;padding:0;background:transparent;display:flex;flex-direction:column;gap:8px;align-items:stretch;text-align:center}
.door .fr{position:relative;aspect-ratio:3/4;border-radius:999px 999px 26px 26px;overflow:hidden;box-shadow:0 0 0 4px #fff,0 0 0 7px var(--p1),0 14px 28px rgba(160,40,110,.25)}
.door .fr::before{content:"";position:absolute;inset:-3px;border-radius:inherit;padding:5px;z-index:2;pointer-events:none;background:conic-gradient(from var(--ea),#ff8fc7,#fff,#c9a7ff,#ffd6a8,#ff8fc7);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:edgeSpin 4s linear infinite}
.door canvas{display:block;width:100%;height:100%}
.door b{font-size:1.25rem}.door small{color:var(--muted);font-weight:700;margin-top:-6px}
.door:active .fr{transform:scale(.97)}
.shero{position:relative;height:230px;border-radius:30px;overflow:hidden;box-shadow:0 0 0 4px #fff,0 0 0 7px var(--p1),var(--sh)}.shero canvas{display:block;width:100%;height:100%;touch-action:manipulation}
.shero .cap{position:absolute;bottom:12px;inset-inline-start:14px;background:rgba(255,255,255,.85);color:#4b1640;border-radius:999px;padding:6px 14px;font-weight:800;pointer-events:none}
.big{background:linear-gradient(180deg,#ff9fd0,#ff6fb5);box-shadow:0 8px 0 #c94a8c,0 14px 24px rgba(255,111,181,.35)}.big:active{box-shadow:0 3px 0 #c94a8c}
/* ===== مدرستي ===== */
.sh2{margin:6px 4px -4px;font-size:1.3rem}
.subj{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sj{position:relative;border:0;border-radius:26px;padding:14px 10px 12px;min-height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#3b1636;box-shadow:0 6px 0 rgba(120,40,90,.18),0 12px 22px rgba(160,40,110,.16);overflow:hidden;transition:transform .12s}
.sj:active{transform:scale(.97)}.sj i{font-style:normal;font-size:2.3rem;line-height:1.1;animation:bob 2.6s ease-in-out infinite}.sj b{font-size:1.15rem}.sj small{font-weight:700;font-size:.78rem;opacity:.75}
.sj em{position:absolute;top:8px;inset-inline-end:10px;font-style:normal;font-size:.8rem;font-weight:800;background:rgba(255,255,255,.75);border-radius:999px;padding:2px 8px}
.sj::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 50% at 20% 0%,rgba(255,255,255,.55),transparent 70%);pointer-events:none}
.sj.g1{background:linear-gradient(140deg,#ffd6ec,#ffb3d9 55%,#e9c6ff)}.sj.g2{background:linear-gradient(140deg,#d9f7ef,#a8ebd9 55%,#c8e9ff)}.sj.g3{background:linear-gradient(140deg,#ffe1e4,#ffb1b9 55%,#fff1f2)}.sj.g4{background:linear-gradient(140deg,#dff1ff,#b4dcff 55%,#e7d9ff)}.sj.g5{grid-column:1/-1;min-height:96px;flex-direction:row;gap:12px;background:linear-gradient(100deg,#ffd6a8,#ffb3d9 35%,#c9a7ff 70%,#9fe3ff)}
.sban{position:relative;border-radius:30px;padding:22px 18px;min-height:132px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;color:#3b1636;box-shadow:0 0 0 4px #fff,0 0 0 7px var(--p1),var(--sh)}
.sban b{font-size:1.5rem;position:relative}.sban span{font-weight:700;opacity:.8;position:relative}
.sban .fl{position:absolute;inset:0}.sban .fl i{position:absolute;font-style:normal;font-size:1.9rem;top:calc(10% + var(--d)*7%);inset-inline-start:calc(52% + var(--d)*9%);animation:floaty calc(3s + var(--d)*.6s) ease-in-out infinite alternate;opacity:.9}
@keyframes floaty{to{transform:translateY(-12px) rotate(8deg)}}
.b-tl{background:linear-gradient(135deg,#2b1050,#7a2f7a 60%,#ff9cc8);color:#fff}.b-din{background:linear-gradient(135deg,#c9f4e9,#a7e0ff 60%,#ffd6ec)}.b-wtn{background:linear-gradient(120deg,#fff 0 30%,#ce1126 30%);color:#fff}.b-wtn b,.b-wtn span{text-shadow:0 2px 8px rgba(0,0,0,.35)}.b-abc{background:linear-gradient(135deg,#bfe6ff,#ffd6ec 60%,#fff1c2)}.b-art{background:linear-gradient(120deg,#ffd6a8,#ffb3d9 40%,#c9a7ff 75%,#9fe3ff)}
.pbar{height:14px;border-radius:999px;background:var(--line);overflow:hidden}.pbar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#ff8fc7,#ffd166,#7ee0a1);transition:width .4s}
.lessons{display:grid;gap:10px}
.les{display:flex;align-items:center;gap:12px;border:0;border-radius:22px;padding:12px 14px;background:var(--card);box-shadow:var(--sh);text-align:start;min-height:68px}
.les .no{flex:none;width:46px;height:46px;border-radius:16px;display:grid;place-items:center;font-weight:900;font-size:1.25rem;background:linear-gradient(135deg,#ffd1e8,#e2c4ff);color:#4b1640}
.les b{flex:1;font-size:1.08rem}.les small{color:var(--muted);font-weight:700;font-size:.82rem}.les em{font-style:normal;width:26px}
.les.done{background:linear-gradient(90deg,var(--card),color-mix(in srgb,var(--sun2) 45%,var(--card)))}
.unit{display:grid;gap:10px}.unit h3{margin:4px 4px 0;font-size:1.2rem}.ul{display:grid;gap:10px}
